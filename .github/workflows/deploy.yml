name: Deploy storefront (VPS)

# main'e her push'ta: testler geçerse kaynak sunucuya kopyalanır, orada
# .github/deploy/sunucu.sh derler, aday konteyneri sınar ve yayına alır; bir
# adım tutmazsa önceki sürüm kalır ya da geri gelir. NEXT_PUBLIC_* değerleri
# sunucudaki docker-compose.yml derleme argümanlarından (.env) gelir.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - '.github/**'
  workflow_dispatch:

concurrency:
  group: deploy-storefront
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Sunucunun anahtarı DEPLOY_KNOWN_HOSTS'ta sabit ("deploy-vps ssh-ed25519 …"):
      # ssh-keyscan'e güvenmek araya girene kapı açardı.
      - name: SSH'ı hazırla
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf '%s\n' "Host deploy" "  HostName $DEPLOY_HOST" "  User $DEPLOY_USER" \
            "  IdentityFile ~/.ssh/id_ed25519" "  HostKeyAlias deploy-vps" "  StrictHostKeyChecking yes" \
            "  ConnectTimeout 20" "  ConnectionAttempts 3" "  ServerAliveInterval 30" "  ServerAliveCountMax 40" \
            > ~/.ssh/config
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/config

      - name: Kaynağı sunucuya kopyala
        run: |
          # rsync zaman zaman ssh bağlantı hatasıyla (exit 255) düşüyor → 4 deneme + artan bekleme.
          n=0
          until rsync -az --delete --exclude='.git' --exclude='.github' \
            --rsync-path='mkdir -p /opt/deprem/ci-staging && rsync' \
            ./ deploy:/opt/deprem/ci-staging/storefront/; do
            n=$((n+1)); [ $n -ge 4 ] && { echo "rsync 4 denemede de başarısız"; exit 1; }
            echo "rsync denemesi $n başarısız, $((n*10))s sonra tekrar..."; sleep $((n*10))
          done

      - name: Derle, sına, yayına al
        run: ssh deploy "SHA=$GITHUB_SHA bash -s" < .github/deploy/sunucu.sh

      - name: Dışarıdan doğrula
        run: curl -fsS -o /dev/null --retry 3 --retry-delay 5 https://depremtek.market/tr
